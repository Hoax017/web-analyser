[package]
name = "web-analyser"
version = "0.1.0"
description = "Network Analyzer visuel et intelligent"
edition = "2021"
rust-version = "1.80"

[lib]
name = "web_analyser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
url = "2"
log = "0.4"
